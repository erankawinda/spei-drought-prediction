[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "spei-forecast"
version = "0.1.0"
description = "Temporally controlled one-month-ahead SPEI forecasting benchmarks"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy==2.2.6",
  "pandas==2.2.3",
  "scikit-learn==1.6.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
spei-forecast = "spei_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
