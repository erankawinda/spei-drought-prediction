name: scientific checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LOKY_MAX_CPU_COUNT: "2"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install exact tested dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps

      - name: Verify source data hashes
        run: sha256sum -c data/SHA256SUMS

      - name: Validate recovered data
        run: spei-forecast validate --config configs/benchmark_v1.toml > /dev/null

      - name: Run tests
        run: pytest
